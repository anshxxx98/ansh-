<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>India Weather App</title>

    <style>

        body{
            margin: 0;
            padding: 0;
            font-family: Arial;
            background: linear-gradient(to right, #141e30, #243b55);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box{
            width: 380px;
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0px 0px 20px rgba(0,0,0,0.4);
        }

        h1{
            color: #243b55;
        }

        input{
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            font-size: 16px;
            border-radius: 8px;
            border: 2px solid #243b55;
            box-sizing: border-box;
        }

        button{
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            background: #243b55;
            color: white;
            cursor: pointer;
        }

        button:hover{
            background: #141e30;
        }

        #result{
            margin-top: 25px;
        }

        .card{
            background: #f2f2f2;
            padding: 20px;
            border-radius: 15px;
        }

        .temp{
            font-size: 50px;
            color: darkblue;
            font-weight: bold;
        }

        .weather{
            font-size: 24px;
            margin: 10px 0;
        }

        p{
            font-size: 18px;
        }

    </style>

</head>

<body>

<div class="box">

    <h1>🌦 Weather App</h1>

    <input type="text"
    id="city"
    placeholder="Enter City">

    <button onclick="getWeather()">
        Check Weather
    </button>

    <div id="result"></div>

</div>

<script>

async function getWeather(){

    let city =
    document.getElementById("city").value;

    if(city == ""){

        document.getElementById("result").innerHTML =
        "❌ Please Enter City Name";

        return;
    }

    // REAL WEATHER DATA
    let url =
    `https://wttr.in/${city}?format=j1`;

    try{

        let response =
        await fetch(url);

        let data =
        await response.json();

        let temp =
        data.current_condition[0].temp_C;

        let weather =
        data.current_condition[0]
        .weatherDesc[0].value;

        let humidity =
        data.current_condition[0]
        .humidity;

        let wind =
        data.current_condition[0]
        .windspeedKmph;

        let feels =
        data.current_condition[0]
        .FeelsLikeC;

        let time =
        new Date().toLocaleTimeString();

        let emoji = "☀";

        if(weather.includes("Cloud")){
            emoji = "☁";
        }

        else if(weather.includes("Rain")){
            emoji = "🌧";
        }

        else if(weather.includes("Mist")){
            emoji = "🌫";
        }

        else if(weather.includes("Thunder")){
            emoji = "⛈";
        }

        document.getElementById("result").innerHTML = `

        <div class="card">

            <h2>📍 ${city}</h2>

            <div class="temp">
                ${temp}°C
            </div>

            <div class="weather">
                ${emoji} ${weather}
            </div>

            <p>🤗 Feels Like : ${feels}°C</p>

            <p>💧 Humidity : ${humidity}%</p>

            <p>🌬 Wind Speed : ${wind} km/h</p>

            <p>🕒 Time : ${time}</p>

        </div>

        `;

    }

    catch(error){

        document.getElementById("result").innerHTML =
        "❌ City Not Found";

    }

}

</script>

</body>
</html>
